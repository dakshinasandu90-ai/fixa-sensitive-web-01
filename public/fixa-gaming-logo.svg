<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="darkShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Aura -->
  <polygon points="250,25 450,90 410,340 250,470 90,340 50,90" fill="none" stroke="url(#primaryRed)" stroke-width="4" filter="url(#neonGlow)" opacity="0.6"/>

  <!-- Main Shield Body -->
  <polygon points="250,40 430,100 395,325 250,445 105,325 70,100" fill="url(#darkShield)" stroke="url(#primaryRed)" stroke-width="8"/>
  <polygon points="250,55 410,110 380,310 250,420 120,310 90,110" fill="#0f0f13" stroke="#27272a" stroke-width="2"/>

  <!-- Golden Wing Flares -->
  <path d="M 120,130 L 190,170 L 150,220 L 100,160 Z" fill="url(#goldAccent)" opacity="0.9"/>
  <path d="M 380,130 L 310,170 L 350,220 L 400,160 Z" fill="url(#goldAccent)" opacity="0.9"/>

  <!-- Crosshair Tactical Ring -->
  <circle cx="250" cy="205" r="95" fill="none" stroke="url(#primaryRed)" stroke-width="3" stroke-dasharray="16,8" filter="url(#neonGlow)"/>
  <circle cx="250" cy="205" r="65" fill="#1c1917" stroke="url(#goldAccent)" stroke-width="2"/>
  <line x1="250" y1="95" x2="250" y2="135" stroke="#ef4444" stroke-width="4"/>
  <line x1="250" y1="275" x2="250" y2="315" stroke="#ef4444" stroke-width="4"/>
  <line x1="140" y1="205" x2="180" y2="205" stroke="#ef4444" stroke-width="4"/>
  <line x1="320" y1="205" x2="360" y2="205" stroke="#ef4444" stroke-width="4"/>

  <!-- Esports Flaming Mask / Emblem Center -->
  <path d="M 250,140 Q 280,170 300,205 Q 280,250 250,265 Q 220,250 200,205 Q 220,170 250,140 Z" fill="url(#primaryRed)" filter="url(#flameGlow)"/>
  
  <!-- Fierce Eyes / Visor -->
  <polygon points="220,195 240,205 225,212" fill="#ffffff" filter="url(#neonGlow)"/>
  <polygon points="280,195 260,205 275,212" fill="#ffffff" filter="url(#neonGlow)"/>
  <polygon points="250,180 258,215 250,225 242,215" fill="url(#goldAccent)"/>

  <!-- Target Crown / Headshot Star -->
  <polygon points="250,75 257,92 275,94 261,105 265,123 250,113 235,123 239,105 225,94 243,92" fill="url(#goldAccent)" filter="url(#neonGlow)"/>

  <!-- Banner for "FIXA" -->
  <path d="M 80,310 L 420,310 L 390,375 L 250,400 L 110,375 Z" fill="#09090b" stroke="url(#primaryRed)" stroke-width="4"/>
  <path d="M 95,318 L 405,318 L 380,368 L 250,390 L 120,368 Z" fill="#18181b"/>

  <!-- Typography: FIXA -->
  <text x="250" y="362" font-family="'Chakra Petch', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#neonGlow)">
    FIXA
  </text>
  <!-- Accent overlay for text -->
  <text x="250" y="362" font-family="'Chakra Petch', 'Impact', sans-serif" font-weight="900" font-size="52" fill="url(#goldAccent)" text-anchor="middle" letter-spacing="6" opacity="0.3">
    FIXA
  </text>

  <!-- Typography: GAMING Subtitle -->
  <rect x="170" y="385" width="160" height="26" rx="4" fill="url(#primaryRed)"/>
  <text x="250" y="403" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="7">
    GAMING
  </text>
</svg>
